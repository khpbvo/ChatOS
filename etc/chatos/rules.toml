[meta]
version = "0.1.0"
hostname = "ubuntu-agent"

[permissions]
# Operations that execute without confirmation
safe_patterns = [
    "cat ", "ls ", "find ", "grep ", "wc ", "head ", "tail ",
    "df ", "uptime", "uname ", "whoami", "date", "cal",
    "dpkg -l", "apt list", "sysctl ", "ip addr", "ip link",
    "ifconfig ", "netstat ", "ss ",
    "ps aux", "top -b", "vmstat", "iostat",
    "systemctl status ",
    "journalctl ",
]

# Operations that require user confirmation via UI
confirm_patterns = [
    "apt install ", "apt-get install ", "apt remove ", "apt-get remove ",
    "systemctl ", "sudo ",
    "mv ", "cp ", "chmod ", "chown ",
    "mkdir ", "rmdir ",
    "tee ", "dd ",
]

# Operations that are NEVER allowed
forbidden_patterns = [
    "rm -rf /",
    "rm -rf /*",
    "dd if=/dev/zero of=/dev/",
    "chmod -R 777 /",
    "halt", "reboot", "shutdown",
    "passwd", "vipw", "usermod", "useradd", "userdel",
    "ufw disable",
    "iptables -F",
    ">/etc/", ">> /etc/",
]

# Paths the agent can never write to
forbidden_write_paths = [
    "/etc/shadow",
    "/etc/sudoers",
    "/etc/chatos/rules.toml",
    "/etc/ufw/",
    "/boot/vmlinuz",
    "/boot/initrd",
]

[resources]
max_concurrent_ops = 5
session_timeout_minutes = 30
