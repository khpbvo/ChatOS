[project]
name = "chatos"
version = "0.1.0"
description = "AI-driven operating system interface for OpenBSD"
requires-python = ">=3.12"
authors = [
    { name = "Kevin van Osch" },
]

dependencies = [
    "claude-agent-sdk",
    "websockets>=13.0",
    "aiohttp>=3.9",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
